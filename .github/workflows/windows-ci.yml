name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: MSVC ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Initialize nested build dependencies
        run: git submodule update --init --recursive --depth 1 -- 3rdparty/dxil-spirv 3rdparty/zydis
      - name: Configure x64 MSVC build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Run host-only tests
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure --no-tests=error -R '^(acphal|anybox|audio|chad|relinker|xapu|xg_xs|xmem)\.'
